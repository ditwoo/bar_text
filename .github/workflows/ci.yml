name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: Build & test
    # Swift Testing (import Testing) needs a Swift 6 toolchain, which ships
    # with Xcode 16 on the macos-15 runners.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
